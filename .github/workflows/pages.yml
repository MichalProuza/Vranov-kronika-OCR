# Sestaví HTML stránku s přepisem kroniky z data/transcriptions.json
# a publikuje ji na GitHub Pages.

name: Publikace na GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "data/transcriptions.json"
      - "04_build_html.py"
      - "name_index.py"
      - "data/rejstrik_vyjimky.txt"
      - "config.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sestavení HTML
        run: |
          python 04_build_html.py --raw
          mkdir -p _site
          cp output/kronika_vranov.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
